
<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087443">

  <title>Medical Store Panel - SARVAJANIK</title>

  <link rel="stylesheet" href="store.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <header class="store-header">
    <h1>SARVAJANIK MEDICAL STORES</h1>
    <p>Medical Store Panel</p>
  </header>

  <main class="store-container">

    <!-- Login -->
    <section id="loginSection" class="panel-card">
      <h2>સ્ટોર લોગિન</h2>

      <form id="loginForm">
        <label for="loginEmail">ઈમેલ</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="તમારો ઈમેલ"
          required
        >

        <label for="loginPassword">પાસવર્ડ</label>
        <input
          type="password"
          id="loginPassword"
          placeholder="તમારો પાસવર્ડ"
          required
        >

        <button type="submit">લોગિન કરો</button>
        <p id="loginMessage"></p>
      </form>
    </section>

    <!-- Dashboard -->
    <section id="dashboardSection" hidden>

      <div class="dashboard-heading">
        <div>
          <h2>સ્ટોર ડેશબોર્ડ</h2>
          <p id="welcomeName">સ્વાગત છે!</p>
        </div>

        <button id="logoutButton" type="button">
          Logout
        </button>
      </div>

      <!-- Store Details -->
      <section class="panel-card">
        <h2>દુકાનની માહિતી</h2>

        <form id="storeForm">

          <label for="shopName">દુકાનનું નામ</label>
          <input
            type="text"
            id="shopName"
            placeholder="દુકાનનું નામ"
            required
          >

          <label for="shopAddress">દુકાનનું સરનામું</label>
          <textarea
            id="shopAddress"
            placeholder="સરનામું"
            required
          ></textarea>

          <label for="shopPhone">ફોન નંબર</label>
          <input
            type="tel"
            id="shopPhone"
            placeholder="ફોન નંબર"
            required
          >

          <label for="shopWhatsapp">WhatsApp નંબર</label>
          <input
            type="tel"
            id="shopWhatsapp"
            placeholder="WhatsApp નંબર"
            required
          >

          <button type="submit">માહિતી સેવ કરો</button>
          <p id="storeMessage"></p>

        </form>
      </section>

      <!-- Medicine Form -->
      <section class="panel-card">

        <h2 id="medicineFormTitle">નવી દવા ઉમેરો</h2>

        <form id="medicineForm">

          <input type="hidden" id="medicineId">

          <label for="medicineName">દવાનું નામ</label>
          <input
            type="text"
            id="medicineName"
            placeholder="દવાનું નામ"
            required
          >

          <label for="medicineCategory">કેટેગરી</label>
          <select id="medicineCategory" required>
            <option value="">કેટેગરી પસંદ કરો</option>
            <option value="Tablet">Tablet</option>
            <option value="Syrup">Syrup</option>
            <option value="Capsule">Capsule</option>
            <option value="Injection">Injection</option>
            <option value="Cream">Cream</option>
            <option value="Drops">Drops</option>
            <option value="Other">Other</option>
          </select>

          <label for="medicineInfo">દવાની માહિતી</label>
          <textarea
            id="medicineInfo"
            placeholder="દવાની સામાન્ય માહિતી"
          ></textarea>

          <label for="medicinePrice">ભાવ (₹)</label>
          <input
            type="number"
            id="medicinePrice"
            min="0"
            step="0.01"
            placeholder="દવાનો ભાવ"
            required
          >

          <label for="medicineUnit">યુનિટ</label>
          <input
            type="text"
            id="medicineUnit"
            placeholder="જેમ કે Strip, Bottle, Pack"
            required
          >

          <label for="medicineStock">સ્ટોક</label>
          <input
            type="number"
            id="medicineStock"
            min="0"
            step="1"
            placeholder="સ્ટોકની સંખ્યા"
            required
          >

          <div class="photo-section">
            <h3>દવાનો ફોટો</h3>

            <label for="medicinePhoto">
              મોબાઇલ Gallery માંથી ફોટો પસંદ કરો
            </label>

            <input
              type="file"
              id="medicinePhoto"
              accept="image/jpeg,image/png,image/webp"
            >

            <img
              id="medicinePhotoPreview"
              alt="દવાનો ફોટો Preview"
              hidden
              style="width:150px;height:150px;object-fit:contain;margin-top:12px;"
            >

            <button
              type="button"
              id="removeMedicinePhoto"
              hidden
            >
              ફોટો દૂર કરો
            </button>

            <p>
              નાનો અને સ્પષ્ટ ફોટો પસંદ કરવો.
            </p>
          </div>

          <label class="check-label">
            <input
              type="checkbox"
              id="prescriptionRequired"
            >
            આ દવા માટે માન્ય પ્રિસ્ક્રિપ્શન જરૂરી છે
          </label>

          <label class="check-label">
            <input
              type="checkbox"
              id="medicineActive"
              checked
            >
            ગ્રાહક એપમાં દવા બતાવો
          </label>

          <button type="submit" id="saveMedicineButton">
            દવા સેવ કરો
          </button>

          <button
            type="button"
            id="cancelEditButton"
            hidden
          >
            ફેરફાર રદ કરો
          </button>

          <p id="medicineMessage"></p>

        </form>
      </section>

      <!-- Medicine List -->
      <section class="panel-card">
        <h2>મારી દવાઓ</h2>
        <div id="storeMedicineList">
          દવાઓ લોડ થઈ રહી છે...
        </div>
      </section>

      <!-- Orders -->
      <section class="panel-card">
        <h2>ઓર્ડર અને પૂછપરછ</h2>
        <div id="storeOrderList">
          હાલમાં ઓર્ડર સિસ્ટમ તૈયાર થઈ રહી છે.
        </div>
      </section>

    </section>

  </main>

  <script type="module" src="store.js"></script>

</body>
</html>
